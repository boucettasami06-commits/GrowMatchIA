name: Budgemy photos (Wikimedia Commons)
on:
  push:
    branches: [budgemy-photos]
    paths: ["queries.json", "scripts/fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/fetch.py
      - run: |
          git config user.name "budgemy-bot"
          git config user.email "budgemy-bot@users.noreply.github.com"
          git add photos manifest.json
          git commit -m "Photos Wikimedia Commons mises à jour" || echo "rien de neuf"
          git push
